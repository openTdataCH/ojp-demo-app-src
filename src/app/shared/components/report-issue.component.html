<div sbbDialogTitle><strong>Report new issue</strong></div>
<div sbbDialogContent class="d-flex flex-column h-100">
  <p *ngIf="errorMessage" class="text-danger" role="alert">{{ errorMessage }}</p>
  <section class="mb-3" aria-labelledby="diagnosticsHeading">
    <div id="diagnosticsHeading" class="form-label">Diagnostics</div>
    <ul class="mb-0">
      <li *ngFor="let row of metadataRows; let first = first" class="mb-2 text-break">
        <span>{{ row }}</span>
        <button *ngIf="first && !gistLinks" type="button" class="btn btn-primary btn-sm ms-2"
          [disabled]="isLoading" (click)="createGists()"
        >{{ isLoading ? 'Creating gists ...' : 'Create request/response XML gists' }}</button>
      </li>
    </ul>
  </section>
  <p id="githubIssueHint" class="text-muted mb-0">Clicking the button below opens github.com in a new tab where you can complete the issue report with a title, description, screenshots and any additional details. <strong>You need to be logged in to GitHub to submit the issue.</strong></p>
</div>

<div sbbDialogActions>
  <div class="d-flex flex-column align-items-end gap-2 w-100">
    <button type="button" class="btn btn-primary"
      aria-describedby="githubIssueHint"
      [disabled]="isLoading" (click)="openGitHubIssue()"
    >Create GitHub Issue</button>
  </div>
</div>
