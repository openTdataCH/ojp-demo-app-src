<div class="d-flex flex-column vh-100 overflow-hidden">
  <web-header *ngIf="!this.appService.isPageFullscreen" class="ms-2"></web-header>
  <nav sbb-tab-nav-bar class="page-tab-bar">
    <a sbb-tab-link [active]="'true'" (click)="this.onActiveTabClick()">Journey Search</a>
    <a sbb-tab-link [active]="'false'" [routerLink]="'../board'" [queryParams]="this.queryParams">Station Board</a>
    <a sbb-tab-link [active]="'false'" [routerLink]="'../trip'" [queryParams]="this.queryParams">Trip Info</a>
    <a sbb-tab-link [active]="'false'" class="page-fullscreen-toggle" (click)="this.appService.togglePageFullscreen()" [title]="this.appService.isPageFullscreen ? 'Restore header and footer' : 'Hide header and footer'">
      <i class="bi" [ngClass]="this.appService.isPageFullscreen ? 'bi-fullscreen-exit' : 'bi-fullscreen'"></i>
    </a>
  </nav>

  <div class="flex-grow-1 d-flex flex-column overflow-hidden p-3">
    <div class="d-flex gap-2 flex-grow-1 overflow-hidden">
      <div class="d-flex flex-column overflow-x-hidden overflow-y-auto" style="width: 600px;">
        
        <div class="flex-shrink-0">
          <app-search-form></app-search-form>
        </div>

        <div class="flex-grow-1 overflow-x-hidden overflow-y-scroll">
          <journey-results></journey-results>
        </div>
      </div>

      <div class="flex-grow-1 h-100">
        <app-map></app-map>
      </div>
    </div>
  </div>

  <web-footer *ngIf="!this.appService.isPageFullscreen" class="ms-2"></web-footer>
</div>
